# Jitsi Management Platform - Docker Compose
# Per specification §13.5, §4.15

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: jmp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jmp
      POSTGRES_USER: jmp
      POSTGRES_PASSWORD: jmp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jmp"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jmp-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: jmp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jmp-network

  # JMP Backend API
  # jmp-api:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   image: jmp-api-dev
  #   pull_policy: never
  #   container_name: jmp-api-dev
  #   restart: "no"
  #   environment:
  #     SPRING_PROFILES_ACTIVE: docker,dev
  #     DB_URL: jdbc:postgresql://postgres:5432/jmp
  #     DB_USER: jmp
  #     DB_PASS: jmp
  #     REDIS_URL: redis
  #     JWT_ACCESS_SECRET: YWNjZXNzLXNlY3JldC1rZXktZm9yLWptcC1wbGF0Zm9ybS0yNTYtYml0cw==
  #     JWT_REFRESH_SECRET: cmVmcmVzaC1zZWNyZXQta2V5LWZvci1qbXAtcGxhdGZvcm0tMjU2LWJpdHM=
  #     JMP_STORAGE_S3_BUCKET: jmp-recordings
  #     JMP_STORAGE_S3_REGION: us-east-1
  #     JMP_STORAGE_S3_ACCESS_KEY: test-access-key
  #     JMP_STORAGE_S3_SECRET_KEY: test-secret-key
  #     JMP_STORAGE_S3_ENDPOINT: http://minio:9000
  #     JITSI_JWT_APP_ID: jmp-platform
