  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     minio:
  #       condition: service_healthy
  #   networks:
  #     - jmp-network
  #   healthcheck:
  #     test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health/liveness"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 10
  #     start_period: 30s

  # JMP Frontend (React)
  # jmp-ui:
  #   build:
  #     context: ./jmp-ui
  #     dockerfile: Dockerfile
  #   image: jmp-ui-dev
  #   pull_policy: never
  #   container_name: jmp-ui-dev
  #   restart: "no"
  #   environment:
  #     VITE_API_URL: /api/v1
  #   ports:
  #     - "5173:80"
  #   depends_on:
  #     - jmp-api
  #   networks:
  #     - jmp-network

  # Prometheus (Metrics)
  prometheus:
    image: prom/prometheus:latest
    container_name: jmp-prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - jmp-network

  # Grafana (Dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: jmp-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - jmp-network

  # MinIO (S3-compatible Object Storage)
  minio:
    image: minio/minio:latest
    container_name: jmp-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: test-access-key
      MINIO_ROOT_PASSWORD: test-secret-key
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jmp-network

  # Jitsi meet (local build of ./jitsi-meet) — serves the UI and, what matters for the
  # LOCAL contour, proxies the XMPP/Colibri signalling to Prosody/JVB (see
  # jitsi-meet/nginx.conf + jitsi-meet/docker/55-jmp-config.sh). Published on 8085
  # because `make dev` occupies 8000; the dev server is pointed here with
  # WEBPACK_DEV_SERVER_PROXY_TARGET, so a hot-reloaded bundle and this container talk to
  # the very same Prosody and therefore land in the very same conference.
  #jitsi-meet:
  #  build:
  #    context: ./jitsi-meet
  #    dockerfile: Dockerfile
  #  image: jmp-jitsi-meet-dev
  #  pull_policy: never
  #  container_name: jmp-jitsi-meet-dev
  #  restart: unless-stopped
  #  environment:
  #    TZ: UTC
  #    # --- contour switches, applied to config.js / nginx.conf at container start ---
  #    # Must match the Prosody virtual host and `main_muc`.
  #    XMPP_DOMAIN: meet.jitsi
  #    XMPP_MUC_DOMAIN: muc.meet.jitsi
  #    PROSODY_URL: http://jitsi-prosody:5280
  #    JVB_WS_URL: http://jitsi-jvb:9090
  #    # No TURN server in the local contour: two-person media goes over the bridge.
  #    DISABLE_P2P: "true"
  #    # Set to /jitsi when the app has to live under a path prefix instead of the root.
  #    APP_PREFIX: ""
  #    # bosh/websocket addresses are derived from the browser origin, so nothing here
  #    # depends on the host name the developers open the page with.
  #    #
  #    # Authentication, lobby and JWT acceptance are decided by Prosody (see
  #    # jitsi-prosody below) and by the tokens issued by jmp-api; the web container
  #    # only serves static files and proxies.
  #  ports:
  #    - "8085:80"
  #  depends_on:
  #    - jitsi-prosody
  #  networks:
  #    - jmp-network

  # Jitsi Prosody (XMPP Server)
  jitsi-prosody:
    image: jitsi/prosody:stable
    container_name: jmp-jitsi-prosody
    restart: unless-stopped
    environment:
      # General
      TZ: UTC
      PUBLIC_URL: http://localhost:8000
      ENABLE_AUTH: 1
      ENABLE_GUESTS: 0
      AUTH_TYPE: jwt
      # JWT configuration
      JWT_APP_ID: jmp-platform
      JWT_APP_SECRET: YWNjZXNzLXNlY3JldC1rZXktZm9yLWptcC1wbGF0Zm9ybS0yNTYtYml0cw==
      JWT_ACCEPTED_ISSUERS: jmp-platform
      JWT_ACCEPTED_AUDIENCES: jitsi
      JWT_ALLOW_EMPTY: 0
      # XMPP configuration
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_BOSH_URL_BASE: http://jitsi-prosody:5280
      XMPP_MUC_DOMAIN: muc.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
      XMPP_GUEST_DOMAIN: guest.meet.jitsi
      XMPP_MODULES: ''
      XMPP_MUC_MODULES: ''
      XMPP_INTERNAL_MUC_MODULES: ''
      # Jicofo credentials
      JICOFO_AUTH_USER: focus
      JICOFO_AUTH_PASSWORD: jicofo-pass-changeme
      # JVB credentials
      JVB_AUTH_USER: jvb
      JVB_AUTH_PASSWORD: jvb-pass-changeme
      JVB_BREWERY_MUC: jvbbrewery
    #expose:
    #  - "5222"
    ports:
      - "5280:5280"
      - "5222:5222"
    volumes:
      - jitsi_prosody_config:/config
      - jitsi_prosody_plugins:/prosody-plugins-custom
    # Jicofo and JVB reach Prosody by the XMPP_SERVER host name, which the Jitsi images
    # default to xmpp.meet.jitsi. Upstream docker-jitsi-meet publishes Prosody under that
    # name, so the alias is what makes the two connect; without it they only log
    # "DNS lookup exception for xmpp.meet.jitsi" and the focus IQ answers
    # service-unavailable, which the browser reports as a failed conference request.
    networks:
      jmp-network:
        aliases:
          - xmpp.meet.jitsi

  # Jitsi Jicofo (Conference Focus)
  jitsi-jicofo:
    image: jitsi/jicofo:stable
    container_name: jmp-jitsi-jicofo
    restart: unless-stopped
    environment:
      # General
      TZ: UTC
      PUBLIC_URL: http://localhost:8000
      ENABLE_AUTH: 1
      ENABLE_GUESTS: 0
      AUTH_TYPE: jwt
      # JWT configuration
      JWT_APP_ID: jmp-platform
      JWT_APP_SECRET: YWNjZXNzLXNlY3JldC1rZXktZm9yLWptcC1wbGF0Zm9ybS0yNTYtYml0cw==
      JWT_ACCEPTED_ISSUERS: jmp-platform
      JWT_ACCEPTED_AUDIENCES: jitsi
      JWT_ALLOW_EMPTY: 0
      # XMPP configuration
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_BOSH_URL_BASE: http://jitsi-prosody:5280
      XMPP_MUC_DOMAIN: muc.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
      XMPP_GUEST_DOMAIN: guest.meet.jitsi
      XMPP_MODULES: ''
      XMPP_MUC_MODULES: ''
      XMPP_INTERNAL_MUC_MODULES: ''
      # Jicofo credentials
      JICOFO_AUTH_USER: focus
      JICOFO_AUTH_PASSWORD: jicofo-pass-changeme
      # JVB credentials
      JVB_AUTH_USER: jvb
      JVB_AUTH_PASSWORD: jvb-pass-changeme
      JVB_BREWERY_MUC: jvbbrewery
    volumes:
      - jitsi_jicofo_config:/config
    depends_on:
      - jitsi-prosody
    networks:
      - jmp-network

  # Jitsi JVB (Video Bridge)
  jitsi-jvb:
    image: jitsi/jvb:stable
    container_name: jmp-jitsi-jvb
    restart: unless-stopped
    environment:
      # General
      TZ: UTC
      PUBLIC_URL: http://localhost:8000
      ENABLE_AUTH: 1
      ENABLE_GUESTS: 0
      AUTH_TYPE: jwt
      # JWT configuration
      JWT_APP_ID: jmp-platform
      JWT_APP_SECRET: YWNjZXNzLXNlY3JldC1rZXktZm9yLWptcC1wbGF0Zm9ybS0yNTYtYml0cw==
      JWT_ACCEPTED_ISSUERS: jmp-platform
      JWT_ACCEPTED_AUDIENCES: jitsi
      JWT_ALLOW_EMPTY: 0
      # XMPP configuration
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_BOSH_URL_BASE: http://jitsi-prosody:5280
      XMPP_MUC_DOMAIN: muc.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
      XMPP_GUEST_DOMAIN: guest.meet.jitsi
      XMPP_MODULES: ''
      XMPP_MUC_MODULES: ''
      XMPP_INTERNAL_MUC_MODULES: ''
      # Jicofo credentials
      JICOFO_AUTH_USER: focus
      JICOFO_AUTH_PASSWORD: jicofo-pass-changeme
      # JVB credentials
      JVB_AUTH_USER: jvb
      JVB_AUTH_PASSWORD: jvb-pass-changeme
      JVB_BREWERY_MUC: jvbbrewery
      # JVB-specific settings
      JVB_PORT: 10000
      JVB_STUN_SERVERS: meet-jit-si-turnrelay.jitsi.net:443
      JVB_TCP_HARVESTER_DISABLED: "true"
    volumes:
      - jitsi_jvb_config:/config
    ports:
      - "10000:10000/udp"
      # colibri-ws (bridge channel) published for the LOCAL contour so webpack-dev-server
      # can proxy /colibri-ws straight to the JVB. Host 9090 is taken by Prometheus, so
      # the JVB's 9090 is exposed on 9091 (loopback only).
      - "127.0.0.1:9091:9090"
    depends_on:
      - jitsi-prosody
    networks:
      - jmp-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  minio_data:
  #jitsi_web_config:
  #jitsi_web_certs:
  #jitsi_transcripts:
  jitsi_prosody_config:
  jitsi_prosody_plugins:
  jitsi_jicofo_config:
  jitsi_jvb_config:

networks:
  jmp-network:
    driver: bridge
