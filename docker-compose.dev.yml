  #     JITSI_JWT_AUDIENCE: jitsi
  #     JITSI_XMPP_DOMAIN: meet.jitsi
  #     JITSI_DOMAIN: localhost:8000
  #     #CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
  #   ports:
  #     - "8081:8080"
