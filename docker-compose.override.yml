services:

# Jitsi meet (Web UI) - Local Build from jitsi-meet project
  # Build locally: docker compose build jitsi-meet
  # Push to registry: docker compose push jitsi-meet
  # On remote: docker compose pull jitsi-meet && docker compose up -d jitsi-meet
  jitsi-meet:
    build:
      context: ./jitsi-meet
      dockerfile: Dockerfile
    image: vostrlog/jmp-jitsi-meet
    container_name: jmp-jitsi-meet
    restart: unless-stopped
    environment:
      TZ: UTC
      # --- contour switches, applied to config.js / nginx.conf at container start ----
      # Identical to the local contour on purpose: the contour differs only in the
      # public host name (nginx-proxy) and in these two addresses being docker DNS
      # names. Changing a contour therefore never requires an image rebuild.
      XMPP_DOMAIN: meet.jitsi
      XMPP_MUC_DOMAIN: muc.meet.jitsi
      PROSODY_URL: http://jitsi-prosody:5280
      JVB_WS_URL: http://jitsi-jvb:9090
      # Until a TURN server is deployed, keep the media of a two-person call on the
      # bridge; otherwise participants behind NATs see nobody and each conference looks
      # like an empty room of its own.
      DISABLE_P2P: "true"
      # Leave empty: meet.slamx.ru serves Jitsi at the root. A path prefix (/jitsi)
      # would have to be stripped by the outer nginx before BOSH/Colibri work.
      APP_PREFIX: ""
      # Where a participant lands once the conference is over (hangup, kicked out,
      # meeting ended for all). The public UI address of this contour; the baked default
      # points at the local dev server (http://localhost:5173/).
      LEAVE_REDIRECT_URL: http://a.slamx.ru/
      # A public STUN is fine for P2P ICE, but it is not a substitute for TURN.
      P2P_STUN_SERVERS: stun:meet-jit-si-turnrelay.jitsi.net:443
      #
      # Authentication (ENABLE_AUTH/AUTH_TYPE/JWT_*) belongs to Prosody, room access
      # decisions belong to jmp-api; this container serves static files and proxies the
      # signalling, so no credentials are configured here.
    # Port 80 exposed internally only (accessed via nginx-proxy)
    expose:
      - "80"
    depends_on:
      - jitsi-prosody
    networks:
      - jmp-network

# JMP Backend API
  jmp-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: vostrlog/jmp-api
    container_name: jmp-api
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/jmp
      DB_USER: jmp
      DB_PASS: jmp
      REDIS_URL: redis
      JWT_ACCESS_SECRET: YWNjZXNzLXNlY3JldC1rZXktZm9yLWptcC1wbGF0Zm9ybS0yNTYtYml0cw==
      JWT_REFRESH_SECRET: cmVmcmVzaC1zZWNyZXQta2V5LWZvci1qbXAtcGxhdGZvcm0tMjU2LWJpdHM=
      JMP_STORAGE_S3_BUCKET: jmp-recordings
      JMP_STORAGE_S3_REGION: us-east-1
      # Must match GARAGE_DEFAULT_ACCESS_KEY / GARAGE_DEFAULT_SECRET_KEY of the garage service.
      JMP_STORAGE_S3_ACCESS_KEY: GK9e4c1f7a2b8d5e0f3a6c9b2d
      JMP_STORAGE_S3_SECRET_KEY: 9f5c2a7e4b1d8f3a6c0e2b5d7a9f1c4e8b3d6a0f2c5e7b9d1a4f6c8e0b2d5a7f
      JMP_STORAGE_S3_ENDPOINT: http://garage:3900
      JITSI_JWT_APP_ID: jmp-platform
      JITSI_JWT_APP_SECRET: YWNjZXNzLXNlY3JldC1rZXktZm9yLWptcC1wbGF0Zm9ybS0yNTYtYml0cw==
      JITSI_JWT_AUDIENCE: jitsi
      JITSI_XMPP_DOMAIN: meet.jitsi
      JITSI_DOMAIN: meet.slamx.ru
      # Public address of the UI — conference join links are built from it.
      JMP_PUBLIC_URL: http://a.slamx.ru
      CORS_ALLOWED_ORIGINS: http://a.slamx.ru,http://meet.slamx.ru,http://localhost:5173,http://localhost:3000
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage:
        condition: service_healthy
    networks:
      - jmp-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health/liveness"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s      

# JMP Frontend (React)
  jmp-ui:
    build:
      context: ./jmp-ui
      dockerfile: Dockerfile
    image: vostrlog/jmp-ui
    container_name: jmp-ui
    restart: unless-stopped
    environment:
      VITE_API_URL: /api/v1
    # Port 80 exposed internally only (accessed via nginx-proxy)
    expose:
      - "80"
    depends_on:
      - jmp-api
    networks:
      - jmp-network

volumes:
  jitsi_meet_config:
  jitsi_meet_certs:
  jitsi_transcripts:
  
networks:
  jmp-network:
    driver: bridge            