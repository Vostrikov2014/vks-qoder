# Serves the Jitsi Meet web app *and* the signalling that the app talks to.
#
# Everything that differs between the local and the production contour (Prosody / JVB
# addresses, path prefix) lives in the `set` lines below; the container entrypoint script
# rewrites them from environment variables at start, so the image itself stays universal
# and switching a contour is a matter of changing the compose file, not the code.
#
# `map` belongs to the http context — conf.d/*.conf is included there, so declaring it
# outside of server{} is valid. The name is prefixed to never collide with another vhost.
map $http_upgrade $jmp_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Enable SSI so that <!--#include virtual=... --> directives in index.html
    # (title.html with the favicon, config.js, interface_config.js) are processed.
    ssi on;

    # Docker's embedded DNS. Resolving the backends at request time (instead of via an
    # `upstream` block) keeps this container startable before Prosody is up and lets it
    # survive a restart of the backend containers.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- contour dependent settings (rewritten by 55-jmp-config.sh) ---------------
    set $jmp_prosody "http://jitsi-prosody:5280";
    set $jmp_jvb "http://jitsi-jvb:9090";
    # -----------------------------------------------------------------------------

    # Values for the `<!--# echo var="..." -->` placeholders at the top of config.js.
    # config.js builds `bosh`/`websocket` as `//host + subdir + 'http-bind'`, so subdir
    # must always carry BOTH surrounding slashes: '/' at the root, '/jitsi/' under a
    # prefix. An empty value would glue the host to the path (`//hosthttp-bind`).
    set $subdir "/";
    set $subdomain "";

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ---------------------------------------------------------------------------
    # XMPP signalling — without these locations the browser has nowhere to connect,
    # and every participant silently ends up in a conference of their own.
    # proxy_pass with a variable forwards the original request URI untouched, which
    # is exactly the path Prosody and the JVB expect.
    # ---------------------------------------------------------------------------

    # BOSH (XMPP over HTTP long polling).
    location = /http-bind {
        proxy_pass $jmp_prosody;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        # BOSH holds the request open for the whole session; do not buffer it.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # XMPP over WebSocket — preferred by lib-jitsi-meet when it is reachable.
    location = /xmpp-websocket {
        proxy_pass $jmp_prosody;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $jmp_connection_upgrade;
        # A websocket session lives as long as the conference does.
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Colibri WebSocket: browser <-> Videobridge media signalling. Only used when the
    # request reaches this container instead of the outer proxy (local contour).
    location ~ ^/colibri-ws/ {
        proxy_pass $jmp_jvb;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $jmp_connection_upgrade;
        proxy_read_timeout 86400;
    }

    # Health check for the orchestration layer.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Handle SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # config.js is the one JS file carrying contour values: index.html pulls it in with
    # `<!--#include virtual="/config.js" -->`, and its `<!--# echo var="subdir" -->`
    # placeholders only expand if the SSI filter is applied to the JS response — the filter
    # runs on `ssi_types`, which is text/html alone by default. Left unprocessed the client
    # silently falls back to a subdir without the prefix and BOSH is dialed at the host root.
    # An exact location also keeps the filter off the multi-megabyte bundles, where a stray
    # `<!--#` in minified code would otherwise be rewritten.
    #
    # It must not be cached either: the file is generated per container from the environment,
    # so an immutable hit would pin one contour's addresses to the browser.
    location = /config.js {
        ssi_types application/javascript;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable cache for HTML
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
