# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m

org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# VKS TV: ограничиваем параллелизм, чтобы сборка не выедала всю память
# (актуально для машин с небольшим объёмом RAM).
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1536m

# VKS TV: повышенные таймауты загрузки зависимостей для нестабильных сетей
# (по умолчанию соединение/чтение рвутся через 30 секунд).
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=600000

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

android.useAndroidX=true

android.enableJetifier=true

# AGP 9.x: возвращаем прежний DSL и legacy Variant API
# (applicationVariants/libraryVariants), которые используют сборка :sdk,
# :app и модули react-native-* из node_modules.
android.newDsl=false

# AGP 9.x: Kotlin подключается плагином kotlin-android (см. buildscript в
# build.gradle), а не встроенной поддержкой Kotlin в AGP.
android.builtInKotlin=false

# Use this property to enable support to the new architecture.
# This will allow you to use TurboModules and the Fabric render in
# your application. You should enable this flag either if you want
# to write custom TurboModules/Fabric components OR use libraries that
# are providing them.
newArchEnabled=false

# Use this property to enable or disable the Hermes JS engine.
hermesEnabled=true

appVersion=99.0.0
sdkVersion=0.0.0
