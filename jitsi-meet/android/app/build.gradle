import org.jetbrains.kotlin.gradle.dsl.JvmTarget

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Crashlytics integration is done as part of Firebase now, so it gets
// automagically activated with google-services.json
if (googleServicesEnabled) {
    apply plugin: 'com.google.firebase.crashlytics'
}

// Use the number of seconds/10 since Jan 1 2019 as the versionCode.
// This lets us upload a new build at most every 10 seconds for the
// next ~680 years.
// https://stackoverflow.com/a/38643838
def vcode = (int) (((new Date().getTime() / 1000) - 1546297200) / 10)

// VKS TV: набор ABI, которые попадают в сборку. По умолчанию сохраняется
// историческое поведение (все четыре ABI). Сборку под ТВ можно сузить, чтобы
// заметно её ускорить, например: -PreactNativeArchitectures=arm64-v8a
def reactNativeArchitectures() {
    return (project.findProperty('reactNativeArchitectures')
        ?: System.getenv('REACT_NATIVE_ARCHITECTURES')
        ?: 'armeabi-v7a,arm64-v8a,x86,x86_64')
        .split(',')
        .collect { it.trim() }
        .findAll { it }
}

android {
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        // VKS TV: уникальный applicationId, чтобы Android не путал приложение
        // с официальным Jitsi Meet из Google Play (пакет org.jitsi.meet).
        // namespace остаётся org.jitsi.meet — к нему привязан Java-пакет кода.
        applicationId 'ru.slamx.vkst'
        versionCode vcode
        versionName project.appVersion

        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        ndk {
            reactNativeArchitectures().each { abiFilters it }
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON", "-DANDROID_STL=c++_shared"
                cppFlags "-std=c++17"
                cFlags "-DANDROID_PLATFORM=android-26"
            }
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        // VKS TV: ключ для release-сборки. Файл ключа в репозиторий не попадает
        // (*.keystore в .gitignore); его создаёт scripts/build-vks-tv.sh или
        // вручную: keytool -genkeypair -keystore keystores/vks-tv.keystore …
        // Пароли можно переопределить переменными окружения VKS_TV_*.
        release {
            def keystoreFile = rootProject.file('keystores/vks-tv.keystore')

            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv('VKS_TV_STORE_PASSWORD') ?: 'vks-tv'
                keyAlias System.getenv('VKS_TV_KEY_ALIAS') ?: 'vks-tv'
                keyPassword System.getenv('VKS_TV_KEY_PASSWORD') ?: 'vks-tv'
            }
        }
    }

    buildTypes {
        debug {
            buildConfigField "boolean", "GOOGLE_SERVICES_ENABLED", "${googleServicesEnabled}"
            buildConfigField "boolean", "LIBRE_BUILD", "${rootProject.ext.libreBuild}"
            applicationIdSuffix ".debug"
        }
        release {
            // VKS TV: если ключ keystores/vks-tv.keystore существует, сборка
            // автоматически подписывается им (см. signingConfigs.release).
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }

            // Uncomment the following line for signing a test release build.
            // signingConfig signingConfigs.debug
            minifyEnabled true
            // AGP 9 больше не разрешает getDefaultProguardFile('proguard-android.txt'):
            // берём -optimize-вариант, а прежний -dontoptimize из старого файла
            // продублирован в proguard-rules-release.pro.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules-release.pro'
            buildConfigField "boolean", "GOOGLE_SERVICES_ENABLED", "${googleServicesEnabled}"
            buildConfigField "boolean", "LIBRE_BUILD", "${rootProject.ext.libreBuild}"
        }
    }

    sourceSets {
        main {
            java {
                if (rootProject.ext.libreBuild) {
                    srcDir "src"
                    exclude "**/GoogleServicesHelper.java"
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility rootProject.ext.javaVersion
        targetCompatibility rootProject.ext.javaVersion
    }

    // VKS TV: раньше .so извлекались при установке через
    // android:extractNativeLibs="true" в AndroidManifest.xml. AGP 9 запрещает
    // задавать это в манифесте, эквивалент — useLegacyPackaging здесь.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    kotlin {
        jvmToolchain(rootProject.ext.jvmToolchainVersion)

        // Kotlin JVM target (JDK 25); compilerOptions — современная замена
        // устаревшему kotlinOptions.
        compilerOptions {
            jvmTarget.set(JvmTarget.fromTarget(rootProject.ext.jvmTargetVersion.toString()))
        }
    }

    namespace 'org.jitsi.meet'
}

// VKS TV: фиксированные имена артефактов: release -> vks-tv.apk,
// debug -> vks-tv-debug.apk.
android.applicationVariants.all { variant ->
    variant.outputs.all { output ->
        output.outputFileName = variant.buildType.name == 'release' ? 'vks-tv.apk' : "vks-tv-${variant.buildType.name}.apk"
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.5.1'

    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.13'

    if (!rootProject.ext.libreBuild) {
        // Sync with react-native-google-signin
        implementation 'com.google.android.gms:play-services-auth:20.5.0'

        // Firebase
        //  - Crashlytics
        implementation 'com.google.firebase:firebase-analytics:21.3.0'
        implementation 'com.google.firebase:firebase-crashlytics:18.4.3'
    }

    implementation project(':sdk')
}

gradle.projectsEvaluated {
    // Dropbox integration
    def dropboxAppKey
    if (project.file('dropbox.key').exists()) {
        dropboxAppKey = project.file('dropbox.key').text.trim() - 'db-'
    }

    if (dropboxAppKey) {
        android.defaultConfig.resValue('string', 'dropbox_app_key', "${dropboxAppKey}")

        def dropboxActivity = """
          <activity
              android:configChanges="keyboard|orientation"
              android:exported="true"
              android:launchMode="singleTask"
              android:name="com.dropbox.core.android.AuthActivity">
            <intent-filter>
              <action android:name="android.intent.action.VIEW" />
              <category android:name="android.intent.category.BROWSABLE" />
              <category android:name="android.intent.category.DEFAULT" />
              <data android:scheme="db-${dropboxAppKey}" />
            </intent-filter>
          </activity>"""

        android.applicationVariants.all { variant ->
            variant.outputs.each { output ->
                output.getProcessManifestProvider().get().doLast {
                    def outputDir = multiApkManifestOutputDirectory.get().asFile
                    def manifestPath = new File(outputDir, 'AndroidManifest.xml')
                    def charset = 'UTF-8'
                    def text
                    text = manifestPath.getText(charset)
                    text = text.replace('</application>', "${dropboxActivity}</application>")
                    manifestPath.write(text, charset)
                }
            }
        }
    }

    // Run React packager
    android.applicationVariants.all { variant ->
        def targetName = variant.name.capitalize()

        def currentRunPackagerTask = tasks.create(
            name: "run${targetName}ReactPackager",
            type: Exec) {
            group = "react"
            description = "Run the React packager."

            doFirst {
                println "Starting the React packager..."

                def androidRoot = file("${projectDir}/../")

                // Set up the call to the script
                workingDir androidRoot

                // Run the packager. The upstream helper is a bash script; a stock
                // Windows environment has no bash, so the PowerShell twin performing
                // the same steps (adb reverse, Metro in a separate window) is used there.
                if (System.getProperty('os.name').toLowerCase().contains('windows')) {
                    commandLine(
                        'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File',
                        new File(androidRoot, 'scripts/run-packager.ps1').absolutePath)
                } else {
                    commandLine('scripts/run-packager.sh')
                }
            }

            // Set up dev mode
            def devEnabled = !targetName.toLowerCase().contains("release")

            // Only enable for dev builds
            enabled devEnabled
        }

        def packageTask = variant.packageApplicationProvider.get()

        packageTask.dependsOn(currentRunPackagerTask)
    }
}

if (googleServicesEnabled) {
    apply plugin: 'com.google.gms.google-services'
}
