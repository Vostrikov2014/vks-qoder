# Jitsi Management Platform Configuration
# Per specification §18.1, §21.2

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain

spring:
  application:
    name: jmp-web
    version: 1.0.0

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jmp}
    username: ${DB_USER:jmp}
    password: ${DB_PASS:jmp}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
          lob:
            non_contextual_creation: true
        order_inserts: true
        order_updates: true
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: jmp
    baseline-on-migrate: true
    create-schemas: true

  data:
    redis:
      host: ${REDIS_URL:localhost}
      port: 6379
      password: ${REDIS_PASS:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# JMP Security Configuration
jmp:
  # Externally reachable address of the JMP web UI. Join links are built from it, so it
  # must be the host users actually type into their browser, not the container address.
  public-url: ${JMP_PUBLIC_URL:https://a.slamx.ru}
  security:
    jwt:
      access-token-secret: ${JWT_ACCESS_SECRET}
      refresh-token-secret: ${JWT_REFRESH_SECRET}
      access-token-expiration-minutes: 15
      refresh-token-expiration-days: 7

# Logging Configuration
logging:
  level:
    root: INFO
    com.jmp: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{trace_id}] %-5level %logger{36} - %msg%n"

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    metrics:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# Jitsi Configuration
jitsi:
  # Public address of the Jitsi web deployment: host[:port][/path-prefix]. A per-tenant
  # value from tenants.jitsi_domain wins over it, so it is the only switch that matters for
  # one tenant. The path prefix is part of the value on purpose: Jitsi shares the platform
  # host and nginx-proxy.conf routes /meet-legacy to the web container, stripping the prefix again.
  domain: ${JITSI_DOMAIN:a.slamx.ru/meet-legacy}
  # Scheme used when building room addresses. The value of jitsi.domain may override it
  # by carrying an explicit scheme of its own.
  scheme: ${JITSI_SCHEME:https}
  # Internal XMPP domain; must be the VirtualHost Prosody serves (XMPP_DOMAIN of the
  # jitsi-prosody container). It goes into the `sub` claim of every Jitsi token.
  xmpp-domain: ${JITSI_XMPP_DOMAIN:meet.jitsi}
  admin-url: ${JITSI_ADMIN_URL:http://localhost:8080}
  admin-secret: ${JITSI_ADMIN_SECRET:}
  jwt:
    app-id: ${JITSI_JWT_APP_ID:jmp-platform}
    app-secret: ${JITSI_JWT_APP_SECRET:YWNjZXNzLXNlY3JldC1rZXktZm9yLWptcC1wbGF0Zm9ybS0yNTYtYml0cw==}
    # How `app-secret` is turned into the HMAC key. 'raw' signs with the literal bytes of
    # the secret, which is what Prosody's token auth uses (Jitsi docker images pass
    # JWT_APP_SECRET through unchanged); 'base64' is only for deployments where Prosody
    # was configured with the decoded key. Both contours must use the same mode as the
    # Prosody they talk to.
    app-secret-type: ${JITSI_JWT_APP_SECRET_TYPE:raw}
    audience: ${JITSI_JWT_AUDIENCE:jitsi}
    # Lifetime of a token embedded into a room address. It has to outlive page reloads
    # inside a meeting, while join links themselves never expire with it.
    token-ttl-minutes: ${JITSI_JWT_TOKEN_TTL_MINUTES:240}

# OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  info:
    title: Jitsi Management Platform API
    description: Centralized platform for administering, monitoring, and managing Jitsi video conferences
    version: 1.0.0
    contact:
      name: JMP Development Team
      email: dev@jmp.example.com
