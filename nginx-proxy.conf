# ---------------------------------------------------------------------------
# Reverse-proxy config for the single public host of this deployment:
#   https://a.slamx.ru/            — JMP frontend + backend
#   https://a.slamx.ru/meet-legacy/ — Jitsi Meet
#
# Jitsi used to live on meet.slamx.ru. It is now served from a path prefix on the
# platform host, which costs nothing but a `location`: same origin for BOSH and the XMPP
# websocket, one certificate, no extra CORS entry. What the prefix cannot cover is the
# Colibri websocket: the bridge advertises an absolute URL, so it keeps a root-level path
# (/colibri-ws/). Both are routed here and the prefix is stripped on the way in — the web
# container always serves from its own root and only tells the browser about the prefix.
#
# This file is loaded by jonasal/nginx-certbot into /etc/nginx/user_conf.d/,
# which is included at the http{} level. That means directives like `map`
# and `upstream` belong here (outside any server{} block).
#
# The image also:
#   * auto-serves /.well-known/acme-challenge/ on port 80
#   * auto-redirects the rest of port 80 to 443
#   * requests a Let's Encrypt certificate for every `server_name` it finds
#     in this file using $CERTBOT_EMAIL, and renews on a schedule.
# ---------------------------------------------------------------------------

# Proper Connection header for both WebSocket and plain HTTP upstream calls.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream frontend { server jmp-ui:80; }
upstream backend  { server jmp-api:8080; }
upstream jitsi    { server jitsi-meet:80; }
# Colibri WebSocket — direct channel to the Videobridge (port 9090).
upstream jitsi_jvb { server jitsi-jvb:9090; }

# ===========================================================================
# The one public host — JMP UI, JMP API, Jitsi Meet under /meet-legacy/
# ===========================================================================
server {
    listen 443 ssl;
    http2  on;
    server_name a.slamx.ru;

    ssl_certificate     /etc/letsencrypt/live/a.slamx.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/a.slamx.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 100M;

    add_header X-Frame-Options        "SAMEORIGIN"                       always;
    add_header X-Content-Type-Options "nosniff"                          always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Backend API
    location /api/ {
        proxy_pass http://backend/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /swagger-ui/ {
        proxy_pass http://backend/swagger-ui/;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs {
        proxy_pass http://backend/v3/api-docs;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        proxy_pass http://backend/actuator/;
        proxy_set_header Host $host;
    }

    # --- Jitsi Meet -------------------------------------------------------
    # The web container serves its app, and proxies BOSH/XMPP, from its own root: the
    # /meet-legacy prefix exists only in the browser address bar and is stripped on the way
    # in. The trailing slash of proxy_pass is what performs that stripping, and it is
    # silently ignored as soon as proxy_pass carries a variable — keep this one literal.
    #
    # The bare path needs its own rule: with no second slash in '/meet-legacy', both
    # contextRoot() in index.html and getLocationContextRoot() in the app take the root of
    # the host as the context, and the service worker would then be registered on '/' —
    # where it would start answering requests meant for the platform.
    location = /meet-legacy {
        return 302 /meet-legacy/$is_args$args;
    }

    location ^~ /meet-legacy/ {
        proxy_pass http://jitsi/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # One conference keeps one request open, on the XMPP websocket as well as on the
        # BOSH long polls, for as long as the participant stays in the room.
        proxy_read_timeout 86400;

        # Deliberately no add_header here: a location-level add_header replaces the
        # server-level HSTS and X-Frame-Options instead of adding to them.
    }

    # Colibri WebSocket — browser <-> Videobridge media signalling. Root level rather than
    # under /meet-legacy because the bridge advertises an absolute
    # wss://$JVB_WS_DOMAIN/colibri-ws/... URL and lib-jitsi-meet dials it verbatim.
    location ~ ^/colibri-ws/ {
        proxy_pass http://jitsi_jvb;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }

    # Frontend SPA — catch-all
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
